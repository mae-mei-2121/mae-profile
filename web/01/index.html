<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>既読文庫 — チャットで読む小説投稿サイト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f4ef; --surface:#ffffff; --ink:#23262e; --sub:#6b6f7a; --faint:#9a9ea8; --line:#e4e1d9;
  --accent:#2f4b9a; --accent-soft:#e8ecf7; --kidoku:#e0663a;
  --sans:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --serif:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}

/* ===== サイト共通 ===== */
.site-head{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.site-head .in{max-width:1200px;margin:0 auto;padding:0 16px;height:60px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{position:relative;width:34px;height:28px;background:var(--accent);border-radius:8px;display:grid;place-items:center;color:#fff;font-family:var(--serif);font-weight:700;font-size:15px}
.logo .mark::after{content:"";position:absolute;left:6px;bottom:-6px;border:6px solid transparent;border-top-color:var(--accent);border-left-color:var(--accent);border-bottom:0;border-right-width:4px}
.logo b{font-family:var(--serif);font-size:21px;font-weight:700;letter-spacing:.08em}
.logo small{font-size:11px;color:var(--sub);letter-spacing:.06em;margin-left:4px}
.head-right{margin-left:auto;display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--surface);transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#243c7d}

.layout{max-width:1200px;margin:0 auto;padding:24px 16px 64px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px}
.side{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:20px;max-height:calc(100vh - 100px);overflow-y:auto;scrollbar-width:thin}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.box h3{font-size:12px;color:var(--sub);font-weight:700;letter-spacing:.1em;margin-bottom:10px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper)}
.search input{border:0;background:none;outline:none;width:100%;font-size:14px}
.search:focus-within{border-color:var(--accent)}
.genres{list-style:none;display:flex;flex-direction:column;gap:2px}
.genres button{width:100%;display:flex;justify-content:space-between;padding:6px 10px;border-radius:6px;font-size:14px;text-align:left}
.genres button:hover{background:var(--paper)}
.genres button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.genres button span{color:var(--faint);font-size:12px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--sub)}
button.tag:hover{border-color:var(--sub)}
.tag.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sort{display:flex;flex-direction:column;gap:6px;font-size:14px}
.sort label{display:flex;gap:8px;align-items:center;cursor:pointer}

.main{display:flex;flex-direction:column;gap:36px;min-width:0}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.sec-title h2{font-size:18px;font-weight:700;letter-spacing:.04em}
.sec-title small{font-size:12px;color:var(--sub)}

.hero{border-radius:16px;padding:28px 28px;background:var(--ink);color:#fff;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;overflow:hidden;position:relative}
.hero h1{font-family:var(--serif);font-size:clamp(20px,2.6vw,28px);line-height:1.5;font-weight:700}
.hero p{font-size:13px;color:#b9bdc8;margin-top:8px}
.hero .demo{display:flex;flex-direction:column;gap:8px;min-width:220px}
.hero .demo .d-narr{font-family:var(--serif);font-size:12px;color:#c9ccd3;border-left:2px solid #555;padding-left:10px}
.hero .demo .d-say{align-self:flex-start;background:#fff;color:var(--ink);font-size:13px;padding:6px 12px;border-radius:14px 14px 14px 4px}
.hero .demo .d-me{align-self:flex-end;display:flex;align-items:flex-end;gap:6px}
.hero .demo .d-me b{background:var(--kidoku);font-size:13px;padding:6px 12px;border-radius:14px 14px 4px 14px;font-weight:400}
.hero .demo .d-me small{font-size:10px;color:#9aa0ad}

/* カード */
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pick .card{height:100%}
.pick .card.post{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px;border-style:dashed;background:transparent;color:var(--sub)}
.pick .card.post b{font-family:var(--serif);font-size:17px;color:var(--ink)}
.pick .card.post small{font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:20px 16px}
.card{display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left}
.card:hover .cover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.14)}
.card .t{font-weight:700;font-size:14px;line-height:1.5}
.card .a{font-size:12px;color:var(--sub)}
.card .m{display:flex;gap:10px;font-size:11px;color:var(--faint)}
/* おすすめ：左に表紙、右に説明 */
.pick .card{display:grid;grid-template-columns:132px minmax(0,1fr);gap:20px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.pick .card:hover{border-color:#c9c4b8}
.pick .badge{display:none}
.pick .info{display:flex;flex-direction:column;gap:6px;min-width:0}
.pick .info .g{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--kidoku)}
.pick .info .t{font-family:var(--serif);font-size:20px;line-height:1.4}
.pick .info .a{font-size:12px;color:var(--sub)}
.pick .info .c{font-family:var(--serif);font-size:14px;line-height:1.7;margin-top:4px}
.pick .info .s{font-size:12px;color:var(--sub);line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pick .info .foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.pick .info .go{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap}

.cover{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;color:#fff;transition:transform .2s,box-shadow .2s;
  background:linear-gradient(160deg,var(--c1),var(--c2))}
.cover .ct{position:absolute;inset:14px 14px 30px;writing-mode:vertical-rl;font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.4;letter-spacing:.08em;text-shadow:0 1px 6px rgba(0,0,0,.25)}
.cover .cg{position:absolute;left:10px;bottom:8px;font-size:10px;letter-spacing:.1em;opacity:.85}
.cover img{position:absolute;inset:0;width:100%;height:100%;display:none}
.cover.has-img img.fg{display:block;object-fit:cover;object-position:50% 30%}
.cover.has-img .ct,.cover.has-img .cg{display:none}
.badge{position:absolute;top:8px;right:8px;font-size:10px;font-weight:700;letter-spacing:.1em;padding:2px 8px;border-radius:4px;z-index:2}
.badge.sample{background:var(--kidoku);color:#fff}
.badge.dummy{background:rgba(255,255,255,.92);color:#555;border:1px solid #999}
.cover.dummy::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.0) 0 10px,rgba(255,255,255,.14) 10px 20px)}
.cover.dummy .ct{opacity:.85}

/* ランキング */
.rank{list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rank li{border-bottom:1px solid var(--line)}
.rank li:last-child{border-bottom:0}
.rank .row{display:grid;grid-template-columns:44px 48px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 16px;width:100%;text-align:left}
.rank .row:hover{background:var(--paper)}
.rank .no{font-family:var(--serif);font-size:20px;font-weight:700;text-align:center;color:var(--faint)}
.rank li:nth-child(-n+3) .no{color:var(--kidoku)}
.rank .cover{aspect-ratio:3/4;border-radius:4px}
.rank .cover .ct,.rank .cover .cg{display:none}
.rank .cover .badge{display:none}
.rank .t{font-weight:700;font-size:14px}
.rank .t .mini{font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;margin-left:8px;vertical-align:2px}
.mini.sample{background:var(--kidoku);color:#fff}
.mini.dummy{border:1px solid #aaa;color:#777}
.rank .a{font-size:12px;color:var(--sub)}
.rank .pv{font-size:12px;color:var(--sub);text-align:right;white-space:nowrap}

.empty{padding:40px;text-align:center;color:var(--sub);background:var(--surface);border:1px dashed var(--line);border-radius:12px}

.site-foot{border-top:1px solid var(--line);background:var(--surface);padding:24px 16px;text-align:center;font-size:12px;color:var(--sub)}
.site-foot a{color:var(--accent)}

/* ===== 作品ページ ===== */
.work{max-width:960px;margin:0 auto;padding:24px 16px 64px}
.crumb{font-size:12px;color:var(--sub);margin-bottom:16px}
.crumb a:hover{color:var(--accent)}
.work-top{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px}
.work-top h1{font-family:var(--serif);font-size:clamp(22px,3vw,30px);line-height:1.4}
.work-top .by{color:var(--sub);font-size:14px;margin-top:6px}
.work-top .catch{font-family:var(--serif);font-size:16px;margin-top:16px;padding-left:12px;border-left:3px solid var(--kidoku)}
.stats{display:flex;flex-wrap:wrap;gap:20px;margin-top:16px;font-size:12px;color:var(--sub)}
.stats b{display:block;font-size:18px;color:var(--ink)}
.work-top .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.work-sec{margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px}
.work-sec h2{font-size:15px;margin-bottom:12px}
.work-sec p{font-size:14px;white-space:pre-line}
.toc{list-style:none}
.toc li{border-top:1px solid var(--line)}
.toc a,.toc span.ng{display:flex;justify-content:space-between;gap:12px;padding:12px 4px;font-size:14px}
.toc a:hover{color:var(--accent)}
.toc span.ng{color:var(--faint)}
.toc small{font-size:12px;color:var(--faint)}

/* ===== 読む画面 ===== */
.reader{min-height:100vh;background:var(--r-bg);color:var(--r-text);--fs:16px}
.reader.size-s{--fs:14px}.reader.size-l{--fs:18px}
.r-bar{position:sticky;top:0;z-index:30;background:var(--r-bar);backdrop-filter:blur(8px);border-bottom:1px solid var(--r-line)}
.r-bar .in{max-width:680px;margin:0 auto;padding:0 12px;height:56px;display:flex;align-items:center;gap:10px}
.r-back{font-size:20px;padding:4px 8px;color:var(--r-sub)}
.r-title{flex:1;min-width:0;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-title small{display:block;font-size:11px;font-weight:400;color:var(--r-sub)}
.r-tool{font-size:11px;padding:6px 10px;border-radius:999px;border:1px solid var(--r-line);color:var(--r-sub);white-space:nowrap}
.r-tool.on{border-color:var(--r-accent);color:var(--r-accent)}
.r-progress{position:fixed;top:0;left:0;height:2px;background:var(--r-accent);z-index:40;width:0}
.r-body{max-width:640px;margin:0 auto;padding:28px 16px 80px;font-size:var(--fs)}
.r-head{text-align:center;margin:12px 0 36px}
.r-head small{font-size:12px;color:var(--r-sub);letter-spacing:.2em}
.r-head h1{font-family:var(--serif);font-size:1.4em;margin-top:6px}

.blk{margin:0 0 14px}
.narr{font-family:var(--serif);color:var(--r-narr);line-height:2.05;margin:22px 0;padding:0 4px}
.sys{text-align:center}
.sys span{display:inline-block;font-size:.72em;padding:3px 12px;border-radius:999px;background:var(--r-sys);color:var(--r-sub)}
.say{display:flex;gap:10px;align-items:flex-start}
.say .av{flex:0 0 36px;height:36px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700}
.say .col{min-width:0;max-width:78%}
.say .nm{font-size:.72em;color:var(--r-sub);margin:0 0 3px 4px}
.bub{display:inline-block;padding:9px 14px;border-radius:4px 18px 18px 18px;background:var(--r-other);color:var(--r-other-text);line-height:1.6;word-break:break-word;font-size:.95em}
.say.me{justify-content:flex-end}
.say.me .row{display:flex;align-items:flex-end;gap:6px;justify-content:flex-end}
.say.me .bub{border-radius:18px 4px 18px 18px;background:var(--r-me);color:var(--r-me-text)}
.say .rd{font-size:.66em;color:var(--r-sub);white-space:nowrap}
.dots{display:inline-flex;gap:4px;padding:4px 2px}
.dots i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.4;animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:.9;transform:translateY(-3px)}}
.say.other:not(.typed) .txt{display:none}
.say.other.typed .dots{display:none}
.say.other .bub{transition:opacity .25s ease,transform .25s ease}
.say.other.paused .bub{opacity:0;transform:scale(.85)}
.say.other.paused .dots i{animation-play-state:paused}
.say .gone{display:none;font-size:.85em;color:var(--r-sub)}
.say.unsend.unsent .bub{background:transparent;border:1px dashed var(--r-line)}
.say.unsend.unsent .txt{display:none}
.say.unsend.unsent .gone{display:inline}
.say.unsend.unsent.static .txt{display:block;text-decoration:line-through;opacity:.45;font-size:.85em}
.say.ghost .bub{background:#4a1f22;color:#ffd9d9;letter-spacing:.06em;animation:ghost 3s infinite steps(1)}
@keyframes ghost{0%,92%,100%{transform:none;filter:none}93%{transform:translateX(2px);filter:blur(.6px)}96%{transform:translateX(-2px)}}
.typing .bub{color:var(--r-sub)}
.typing .tx{font-size:.72em;color:var(--r-sub);margin:4px 0 0 4px}

.notice{display:flex;gap:10px;align-items:center;background:var(--r-sys);border:1px solid var(--r-line);border-radius:14px;padding:10px 12px;margin:20px 0}
.notice .ic{flex:0 0 34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-weight:700}
.notice .nt{font-size:.8em;line-height:1.5;min-width:0}
.notice .nt b{display:block;font-size:.85em;color:var(--r-sub);font-weight:500}

.illust{margin:32px -4px}
.illust .frame{position:relative;aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:var(--r-sys);border:1px solid var(--r-line)}
.illust .frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.illust .ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--r-sub);font-size:12px;
  background:linear-gradient(to top right,transparent calc(50% - .5px),var(--r-line) 50%,transparent calc(50% + .5px)),linear-gradient(to bottom right,transparent calc(50% - .5px),var(--r-line) 50%,transparent calc(50% + .5px))}
.illust .ph span{background:var(--r-sys);padding:6px 12px;border:1px solid var(--r-line);border-radius:4px}
.illust .cap{font-size:.75em;color:var(--r-sub);text-align:center;margin-top:8px}

.r-end{margin-top:56px;text-align:center;padding-top:28px;border-top:1px solid var(--r-line)}
.r-end p{font-family:var(--serif);font-size:1.05em;letter-spacing:.2em}
.r-end small{display:block;font-size:12px;color:var(--r-sub);margin-top:6px}
.r-end .acts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:20px}
.r-end .btn{background:transparent;color:var(--r-text);border-color:var(--r-line)}

/* 出てくる演出 */
.fxon .blk{transition:opacity .45s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
.fxon .blk:not(.in){opacity:0;transform:translateY(14px)}
.fxon .say:not(.in){transform:translateY(10px) scale(.94)}
.fxon .say.other{transform-origin:left top}
.fxon .say.me{transform-origin:right top}
.fxon .illust:not(.in){transform:none}
.fxon .illust.in.anim.fx-dark .frame{animation:flickIn 1s steps(1)}
.fxon .illust.in.anim.fx-glow .frame{animation:glowIn 1.2s ease}
.fxon .illust.in.anim.fx-glitch .frame{animation:glitchIn .8s steps(2)}
@keyframes flickIn{0%{opacity:0}15%{opacity:1}25%{opacity:.1}40%{opacity:1}50%{opacity:.3}60%,100%{opacity:1}}
@keyframes glowIn{0%{filter:blur(12px) brightness(1.8);opacity:0}100%{filter:none;opacity:1}}
@keyframes glitchIn{0%{clip-path:inset(0 0 70% 0);transform:translateX(-8px)}25%{clip-path:inset(40% 0 20% 0);transform:translateX(6px)}50%{clip-path:inset(10% 0 50% 0);transform:translateX(-4px)}75%{clip-path:inset(60% 0 0 0);transform:translateX(3px)}100%{clip-path:inset(0);transform:none}}

.fx-layer{position:fixed;inset:0;z-index:50;pointer-events:none;opacity:0}
.fx-layer.dark{background:#000;animation:fxDark 1.3s steps(1) forwards}
@keyframes fxDark{0%{opacity:0}10%{opacity:.95}22%{opacity:.4}30%{opacity:.97}55%{opacity:.85}70%{opacity:.97}100%{opacity:0}}
.fx-layer.glow{background:radial-gradient(circle at 50% 50%,rgba(255,240,225,.95),rgba(255,220,200,.55) 45%,rgba(255,255,255,0) 75%);animation:fxGlow 1.1s ease forwards}
@keyframes fxGlow{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
.fx-layer.glitch{background:repeating-linear-gradient(0deg,rgba(92,200,255,.16) 0 2px,transparent 2px 5px),linear-gradient(90deg,rgba(255,0,90,.12),rgba(0,200,255,.12));animation:fxGlitch .9s steps(1) forwards}
@keyframes fxGlitch{0%{opacity:1;transform:translateX(0)}15%{transform:translateX(-12px)}30%{transform:translateX(8px);opacity:.6}45%{transform:translateX(-4px);opacity:1}60%{transform:none;opacity:.5}80%{opacity:.9}100%{opacity:0}}
.shake{animation:shake .5s steps(2)}
@keyframes shake{25%{transform:translateX(-3px)}50%{transform:translateX(3px)}75%{transform:translateX(-2px)}}

/* プッシュ通知風のトースト */
.push{position:fixed;top:12px;left:50%;z-index:60;width:min(360px,calc(100% - 24px));transform:translate(-50%,-140%);transition:transform .45s cubic-bezier(.2,.9,.2,1);
  background:rgba(250,250,252,.96);color:#222;border-radius:16px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;font-size:13px}
.push.on{transform:translate(-50%,0)}
.push .ic{flex:0 0 32px;height:32px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-weight:700}
.push b{display:block;font-size:11px;color:#777;font-weight:500}

/* ダイアログ・トースト */
.modal{position:fixed;inset:0;z-index:70;background:rgba(20,22,28,.5);display:grid;place-items:center;padding:16px}
.modal .panel{background:var(--surface);border-radius:16px;max-width:420px;width:100%;padding:24px}
.modal h3{font-size:17px;margin-bottom:8px}
.modal p{font-size:14px;color:var(--sub)}
.modal ul{list-style:none;margin:16px 0;display:flex;flex-direction:column;gap:8px}
.modal ul a{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-weight:700}
.modal ul a:hover{border-color:var(--accent);color:var(--accent)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:80;background:var(--ink);color:#fff;font-size:13px;padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}

/* テーマ */

    <div class="ct">${esc(w.title)}</div><div class="cg">${esc(w.genre)}</div></div>`;
}

function card(w){
  return `<a class="card" ${link(w)}>${cover(w)}
    <div class="t">${esc(w.title)}</div><div class="a">${esc(w.author)}</div>
    <div class="m"><span>${esc(w.genre)}</span><span>${num(w.pv)} PV</span></div></a>`;
}
function header(){
  return `<header class="site-head"><div class="in">
    <a class="logo" href="#/"><span class="mark">既</span><b>既読文庫</b><small>チャットで読む小説投稿サイト</small></a>
    <div class="head-right"><button class="btn" data-fake>ログイン</button><button class="btn primary" data-fake>作品を投稿する</button></div>
  </div></header>`;
}
function footer(){
  return `<footer class="site-foot">※既読文庫は架空のサービスです。掲載作品はサンプル（3作品）とダミーデータです。<br>
    制作：メイ（Mae）　<a href="../../index.html">← mae.exe に戻る</a></footer>`;
}

/* ---------- トップ ---------- */
function renderTop(){
  const count = g => WORKS.filter(w => w.genre === g).length;
  const tagAll = [...new Set(WORKS.flatMap(w => w.tags))].slice(0, 18);
  app.innerHTML = header() + `<div class="layout">
    <aside class="side">
      <div class="box"><h3>作品をさがす</h3>
        <label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="タイトル・作者・タグ" value="${esc(state.q)}"></label></div>
      <div class="box"><h3>ジャンル</h3><ul class="genres">
        <li><button data-genre="" class="${state.genre===''?'on':''}">すべて<span>${WORKS.length}</span></button></li>
        ${GENRES.map(g=>`<li><button data-genre="${g}" class="${state.genre===g?'on':''}">${g}<span>${count(g)}</span></button></li>`).join('')}
      </ul></div>
      <div class="box"><h3>人気のタグ</h3><div class="tags">
        ${tagAll.map(t=>`<button class="tag ${state.tag===t?'on':''}" data-tag="${esc(t)}">#${esc(t)}</button>`).join('')}
      </div></div>
      <div class="box sortbox"><h3>並び順</h3><div class="sort">
        ${[['pop','人気順'],['new','新着順'],['len','文字数が多い順']].map(([v,l])=>`<label><input type="radio" name="sort" value="${v}" ${state.sort===v?'checked':''}>${l}</label>`).join('')}
      </div></div>
    </aside>
    <main class="main" id="main"></main>
  </div>` + footer();
  renderMain();
  const q = $('#q');
  q.addEventListener('input', () => { state.q = q.value.trim(); renderMain(); });
}

function sorted(list){
  const f = { pop:(a,b)=>b.pv-a.pv, new:(a,b)=>b.updated.localeCompare(a.updated), len:(a,b)=>chars(b)-chars(a) }[state.sort];
  return [...list].sort(f);
}

function renderMain(){
  const main = $('#main'); if (!main) return;
  const filtering = state.q || state.genre || state.tag;
  if (filtering){
    const q = state.q.toLowerCase();
    const hit = sorted(WORKS.filter(w =>
      (!state.genre || w.genre === state.genre) &&
      (!state.tag || w.tags.includes(state.tag)) &&
      (!q || [w.title, w.author, w.genre, ...w.tags, w.summary].join(' ').toLowerCase().includes(q))));
    const label = [state.genre, state.tag && '#'+state.tag, state.q && `「${state.q}」`].filter(Boolean).join(' / ');
    main.innerHTML = `<section><div class="sec-title"><h2>検索結果：${esc(label)}</h2><small>${hit.length}件　<button class="tag" data-clear>条件をクリア</button></small></div>
      ${hit.length ? `<div class="grid">${hit.map(card).join('')}</div>` : `<div class="empty">条件に合う作品が見つかりませんでした。</div>`}</section>`;
    return;
  }
  const rank = [...WORKS].sort((a,b)=>b.pv-a.pv).slice(0,10);
  const fresh = [...WORKS].sort((a,b)=>b.updated.localeCompare(a.updated)).slice(0,12);
  main.innerHTML = `
    <section class="hero">
      <div><h1>セリフはトークで、<br>描写は文章で。</h1><p>チャットの読みやすさと、小説の描写を両方。既読文庫は、トーク画面のように読める小説投稿サイトです。</p></div>
      <div class="demo" aria-hidden="true"><div class="d-narr">夕暮れの屋上に、風が吹いた。</div><div class="d-say">来るの早すぎ</div><div class="d-me"><small>既読</small><b>後ろ</b></div></div>
    </section>
    <section><div class="sec-title"><h2>編集部のおすすめ</h2><small>最後まで読めるサンプル作品</small></div>
      <div class="pick">${SAMPLES.map(w=>`<a class="card" href="#/work/${w.id}">${cover(w)}
        <div class="info"><span class="g">${esc(w.genre)}</span><span class="t">${esc(w.title)}</span><span class="a">${esc(w.author)}　・　${num(chars(w))}文字　・　${num(w.pv)} PV</span>
          <p class="c">${esc(w.catch)}</p><p class="s">${esc(w.summary.replace(/\n/g,''))}</p>
          <div class="foot">${w.tags.slice(0,3).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}<span class="go">読む →</span></div></div></a>`).join('')}
        <button class="card post" data-fake><b>あなたの作品も、ここに。</b><small>トーク形式の小説を投稿して、編集部のおすすめを目指そう</small><span class="btn primary">作品を投稿する</span></button></div></section>
    <section><div class="sec-title"><h2>総合ランキング</h2><small>週間 PV 順</small></div>
      <ol class="rank">${rank.map((w,i)=>`<li><a class="row" ${link(w)}><span class="no">${i+1}</span>${cover(w)}
        <span><span class="t">${esc(w.title)}<span class="mini ${w.dummy?'dummy':'sample'}">${w.dummy?'DUMMY':'読める'}</span></span><br><span class="a">${esc(w.author)}・${esc(w.genre)}</span></span>
        <span class="pv">${num(w.pv)} PV</span></a></li>`).join('')}</ol></section>
    <section><div class="sec-title"><h2>新着・更新</h2><small>${fresh.length}作品</small></div>
      <div class="grid">${fresh.map(card).join('')}</div></section>`;
}

/* ---------- 作品ページ ---------- */
function renderWork(w){
  app.innerHTML = header() + `<div class="work">
    <nav class="crumb"><a href="#/">トップ</a> ／ ${esc(w.genre)} ／ ${esc(w.title)}</nav>
    <div class="work-top">${cover(w)}
      <div><h1>${esc(w.title)}</h1><div class="by">作者：${esc(w.author)}</div>
        <p class="catch">${esc(w.catch)}</p>
        <div class="tags" style="margin-top:14px">${w.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div>
        <div class="stats"><span><b>${num(w.pv)}</b>PV</span><span><b>${num(w.likes)}</b>いいね</span><span><b>${num(chars(w))}</b>文字</span><span><b>${w.updated.replace(/-/g,'/')}</b>最終更新</span></div>
        <div class="acts"><a class="btn primary" href="#/read/${w.id}/1">第1話から読む</a><button class="btn" data-fake>♡ いいね</button><button class="btn" data-fake>＋ 本棚に追加</button></div>
      </div></div>
    <section class="work-sec"><h2>あらすじ</h2><p>${esc(w.summary)}</p></section>
    <section class="work-sec"><h2>目次</h2><ul class="toc">
      ${w.episodes.map((e,i)=>`<li><a href="#/read/${w.id}/${i+1}">${esc(e.title)}<small>${w.updated.replace(/-/g,'/')}</small></a></li>`).join('')}
      <li><span class="ng">第2話　（サンプルでは第1話まで）<small>未収録</small></span></li>
    </ul></section>
  </div>` + footer();
}

/* ---------- 読む画面 ---------- */
function blockHTML(b, w){
  const [t] = b;
  if (t === 'n') return `<p class="blk narr" data-t="n">${esc(b[1])}</p>`;
  if (t === 'sys') return `<div class="blk sys" data-t="sys"><span>${esc(b[1])}</span></div>`;
  if (t === 'notice') return `<div class="blk notice" data-t="notice" data-text="${esc(b[1]+'：'+b[2])}"><div class="ic">既</div><div class="nt"><b>${esc(b[1])}</b>${esc(b[2])}</div></div>`;
  if (t === 'i') return `<figure class="blk illust fx-${b[2]}" data-t="illust" data-fx="${b[2]}"><div class="frame">
      <div class="ph"><span>挿絵：${esc(b[3])}<br>NO IMAGE</span></div><img src="img/${b[1]}.jpg" alt="${esc(b[3])}" onerror="this.remove()"></div>
      <figcaption class="cap">${esc(b[3])}</figcaption></figure>`;
  if (t === 'typing'){
    const c = w.chars[b[1]];
    return `<div class="blk say other typing" data-t="typing"><div class="av" style="--c:${c.color}">${esc(c.name[0])}</div>
      <div class="col"><div class="nm">${esc(c.name)}</div><div class="bub"><span class="dots"><i></i><i></i><i></i></span></div><div class="tx">${esc(c.name)}が入力中…</div></div></div>`;
  }
  if (t === 's' || t === 'u'){
    const who = b[1], text = b[2], opt = b[3] || {}, c = w.chars[who];
    if (c && who === 'me'){
      return `<div class="blk say me${opt.ghost?' ghost':''}" data-t="say"><div class="col"><div class="row">
        ${opt.noread ? '' : '<span class="rd">既読</span>'}<div class="bub"><span class="txt">${esc(text)}</span></div></div></div></div>`;
    }
    const wa = (opt.hesitate ? ` data-hes="${opt.hesitate}"` : '') + (opt.long ? ' data-long="1"' : '') + (opt.instant ? ' data-instant="1"' : '');
    return `<div class="blk say other${t==='u'?' unsend':''}" data-t="say" data-len="${text.length}"${wa}>
      <div class="av" style="--c:${c.color}">${esc(c.name[0])}</div>
      <div class="col"><div class="nm">${esc(c.name)}</div><div class="bub"><span class="dots"><i></i><i></i><i></i></span><span class="txt">${esc(text)}</span><span class="gone">メッセージの送信を取り消しました</span></div></div></div>`;
  }
  return '';
}

let io = null, queue = [], busy = false, timers = [];
const wait = ms => new Promise(r => timers.push(setTimeout(r, ms)));

function renderRead(w, epNo){
  const ep = w.episodes[epNo-1] || w.episodes[0];
  app.innerHTML = `<div class="reader theme-${w.theme} size-${settings.size}${settings.fx?' fxon':''}" id="reader">
    <div class="r-progress" id="prog"></div>
    <div class="r-bar"><div class="in">
      <a class="r-back" href="#/work/${w.id}" aria-label="作品ページへ戻る">‹</a>
      <div class="r-title">${esc(w.title)}<small>${esc(ep.title)}</small></div>
      <button class="r-tool ${settings.fx?'on':''}" id="fxbtn" aria-pressed="${settings.fx}">演出 ${settings.fx?'ON':'OFF'}</button>
      <button class="r-tool" id="sizebtn">文字 ${({s:'小',m:'中',l:'大'})[settings.size]}</button>
    </div></div>
    <article class="r-body" id="body">
      <header class="r-head"><small>${esc(w.author)}</small><h1>${esc(ep.title)}</h1></header>
      ${ep.blocks.map(b => blockHTML(b, w)).join('')}
      <div class="r-end"><p>第1話　おわり</p><small>サンプルでは第1話までお読みいただけます</small>
        <div class="acts"><a class="btn" href="#/work/${w.id}">作品ページへ</a><a class="btn" href="#/">ほかの作品をさがす</a></div></div>
    </article></div>`;
  $('#fxbtn').addEventListener('click', toggleFx);
  $('#sizebtn').addEventListener('click', () => {
    settings.size = ({s:'m', m:'l', l:'s'})[settings.size]; saveSettings();
    const r = $('#reader'); r.classList.remove('size-s','size-m','size-l'); r.classList.add('size-'+settings.size);
    $('#sizebtn').textContent = '文字 ' + ({s:'小',m:'中',l:'大'})[settings.size];
  });
  window.addEventListener('scroll', onProgress, { passive:true });
  onProgress();
  startReveal();
}

function onProgress(){
  const p = $('#prog'); if (!p) return;
  const h = document.documentElement.scrollHeight - innerHeight;
  p.style.width = (h > 0 ? Math.min(100, scrollY / h * 100) : 100) + '%';
}

function finalize(el){
  el.classList.add('in','typed');
  if (el.classList.contains('unsend')) el.classList.add('unsent','static');
}

function startReveal(){
  const blks = [...document.querySelectorAll('#body .blk:not(.in)')];
  if (!settings.fx || !('IntersectionObserver' in window)){ blks.forEach(finalize); return; }
  io = new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting){ io.unobserve(e.target); queue.push(e.target); } });
    pump();
  }, { rootMargin:'0px 0px -10% 0px', threshold:0.1 });
  blks.forEach(b => io.observe(b));
}

function pump(){
  if (busy || !queue.length) return;
  busy = true;
  const el = queue.shift();
  reveal(el, queue.length > 3).then(() => { busy = false; pump(); });
}

async function reveal(el, fast){
  const t = el.dataset.t;
  if (t === 'illust'){
    if (!fast){ await playFx(el.dataset.fx); el.classList.add('anim'); }
    el.classList.add('in');
    await wait(fast ? 40 : 700);
    return;
  }
  if (el.dataset.instant) el.classList.add('typed');
  el.classList.add('in');
  if (t === 'say' && el.classList.contains('other')){
    const h = Number(el.dataset.hes || 0), isLong = !!el.dataset.long;
    if (el.dataset.instant){
      if (!fast) await wait(260);
    } else if (h || isLong){
      // 迷う・長考は話の見せ場なので、速くスクロールしていても省かない（少し短くする）
      const k2 = fast ? 0.6 : 1;
      for (let k = 0; k < h; k++){
        await wait((1000 + k * 300) * k2);
        el.classList.add('paused');
        await wait((1300 + k * 500) * k2);
        el.classList.remove('paused');
      }
      await wait((isLong ? 2800 : 600) * k2);
    } else if (!fast){
      await wait(420 + Math.min(Number(el.dataset.len||0) * 22, 650));
    }
    el.classList.add('typed');
    if (el.classList.contains('unsend')) wait(1500).then(() => el.classList.add('unsent'));
    await wait(fast ? 40 : 180);
    return;
  }
  if (t === 'notice' && !fast) showPush(el.dataset.text);
  await wait(fast ? 40 : (t === 'n' ? 260 : 180));
}

async function playFx(type){
  const fx = $('#fx');
  fx.className = 'fx-layer'; void fx.offsetWidth; fx.className = 'fx-layer ' + type;
  if (type === 'glitch'){ const r = $('#reader'); r && r.classList.add('shake'); wait(500).then(()=>r && r.classList.remove('shake')); }
  await wait(type === 'dark' ? 900 : type === 'glow' ? 450 : 500);
  wait(800).then(() => { fx.className = 'fx-layer'; });
}

function showPush(text){
  const p = $('#push'); $('#push-text').textContent = text;
  p.classList.add('on');
  wait(2600).then(() => p.classList.remove('on'));
}

function toggleFx(){
  settings.fx = !settings.fx; saveSettings();
  const r = $('#reader'), b = $('#fxbtn');
  r.classList.toggle('fxon', settings.fx);
  b.classList.toggle('on', settings.fx); b.setAttribute('aria-pressed', settings.fx);
  b.textContent = '演出 ' + (settings.fx ? 'ON' : 'OFF');
  if (!settings.fx){ stopReveal(); document.querySelectorAll('#body .blk').forEach(finalize); }
  else { startReveal(); }
}

function stopReveal(){
  if (io){ io.disconnect(); io = null; }
  queue = []; busy = false; timers.forEach(clearTimeout); timers = [];
  const fx = $('#fx'); if (fx) fx.className = 'fx-layer';
  const p = $('#push'); if (p) p.classList.remove('on');
}

/* ---------- ダミー作品 ---------- */
function showDummy(w){
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `<div class="panel" role="dialog" aria-modal="true"><h3>「${esc(w.title)}」はダミー作品です</h3>
    <p>この作品は一覧を見せるためのダミーデータで、本文はありません。最後まで読めるのは、次の3作品です。</p>
    <ul>${SAMPLES.map(s=>`<li><a href="#/work/${s.id}">${esc(s.title)}　<small style="font-weight:400;color:var(--sub)">${esc(s.genre)}</small></a></li>`).join('')}</ul>
    <button class="btn" data-close>閉じる</button></div>`;
  document.body.appendChild(m);
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]') || e.target.closest('a')) m.remove(); });
}

/* ---------- クリック操作のまとめ ---------- */
document.addEventListener('click', e => {
  const d = e.target.closest('[data-dummy]');
  if (d){ e.preventDefault(); showDummy(byId(d.dataset.dummy)); return; }
  if (e.target.closest('[data-fake]')){ toast('サンプルのため、この機能は動きません'); return; }
  const g = e.target.closest('[data-genre]');
  if (g){ state.genre = g.dataset.genre; renderTop(); return; }
  const t = e.target.closest('[data-tag]');
  if (t){ state.tag = state.tag === t.dataset.tag ? '' : t.dataset.tag; renderTop(); return; }
  if (e.target.closest('[data-clear]')){ Object.assign(state, { q:'', genre:'', tag:'' }); renderTop(); return; }
});
document.addEventListener('change', e => {
  if (e.target.name === 'sort'){ state.sort = e.target.value; renderMain(); }
});

/* ---------- 画面の切り替え ---------- */
function route(){
  stopReveal();
  window.removeEventListener('scroll', onProgress);
  const [page, id, ep] = location.hash.replace(/^#\/?/, '').split('/');
  const w = byId(id);
  if (page === 'work' && w && !w.dummy) renderWork(w);
  else if (page === 'read' && w && !w.dummy) renderRead(w, Number(ep) || 1);
  else renderTop();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
